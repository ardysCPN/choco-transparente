version: "3.9"

services:
  # ============================================================================
  # 1. BASE DE DATOS POSTGRESQL 15 CON EXTENSIÓN POSTGIS NATIVA
  # ============================================================================
  postgres:
    image: postgis/postgis:15-3.4
    container_name: choco-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./script-BD-demo.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - choco_network

  # ============================================================================
  # 2. BACKEND API REST (Node.js + Express + Prisma)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: choco-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_TIEMPO_EXPIRACION: ${JWT_TIEMPO_EXPIRACION}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
    networks:
      - choco_network

  # ============================================================================
  # 3. FRONTEND PORTAL PÚBLICO & ADMIN (React + Vite + Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: choco-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - choco_network

# ==============================================================================
# VOLÚMENES Y REDES PERSISTENTES
# ==============================================================================
volumes:
  postgres_data:

networks:
  choco_network:
    driver: bridge
